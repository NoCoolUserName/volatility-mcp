[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-mcp"
version = "0.1.2"
description = "A local MCP server for controlled, evidence-preserving Volatility 3 queries"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR LicenseRef-Volatility-Software-License-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSING.md", "licenses/MIT.txt", "licenses/LicenseRef-Volatility-Software-License-1.0.txt", "licenses/DEPENDENCY_LICENSES.txt"]
dependencies = ["mcp==2.3.0", "pefile==2024.8.26"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.scripts]
volatility-mcp = "volatility_mcp.cli:main"

[project.optional-dependencies]
ui = [] # Legacy extra; Workbench is a separate distribution. See its repository.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volatility_mcp = ["plugins/*.py", "resources/*.md", "resources/*.json", "resources/*.json.gz", "resources/symbol-packs/*.zip"]
