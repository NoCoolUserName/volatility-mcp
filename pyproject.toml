[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-mcp"
version = "0.1.0"
description = "A local MCP server for controlled, evidence-preserving Volatility 3 queries"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==2.3.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.scripts]
volatility-mcp = "volatility_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volatility_mcp = ["plugins/*.py"]
