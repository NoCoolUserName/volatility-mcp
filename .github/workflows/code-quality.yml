name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: NoCoolUserName/code-quality/.github/workflows/quality.yml@ae78a9db0fccd54519604c655aafc37384e08771 # reviewed Actions update (code-quality#11)
    with:
      typecheck-command: python -m mypy --follow-imports=silent --check-untyped-defs src/volatility_mcp/timestamps.py src/volatility_mcp/json_rows.py src/volatility_mcp/config.py
