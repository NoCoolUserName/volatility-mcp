# Monthly proposals; the separate guarded merge controller enforces eligibility.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  groups:
    monthly-updates:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
    compatible-patches:
      patterns: ['*']
      update-types: [patch]
    compatibility-review:
      patterns: ['*']
      update-types: [minor, major]
  # pydantic 2.13.5 requires pydantic-core==2.46.5; this candidate cannot resolve.
  ignore:
  - dependency-name: pydantic-core
    versions: ['2.49.0']
